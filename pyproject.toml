[project]
name = "content-sumarizer"
version = "0.1.0"
description = "Telegram bot that turns TikTok links into Obsidian notes"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "httpx>=0.28.1",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
