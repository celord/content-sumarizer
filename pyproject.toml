[project]
name = "content-sumarizer"
version = "0.1.0"
description = "Telegram bot that turns TikTok links into Obsidian notes"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
