[project]
name = "content-sumarizer"
version = "0.1.0"
description = "Telegram bot that turns TikTok links into Obsidian notes"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
