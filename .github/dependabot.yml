# TikTok changes its site often and old yt-dlp versions stop downloading.
# Dependabot opens a PR whenever a new yt-dlp is released; merge it, then
# on the server: git pull && docker compose up -d --build
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "yt-dlp"
    open-pull-requests-limit: 2
